<VirtualHost *:80>
  ServerName source.haan.lu
  Redirect permanent / https://source.haan.lu/
</VirtualHost>

<VirtualHost *:443>
  ServerName source.haan.lu
  DocumentRoot /var/www/source/dist

  <Directory /var/www/source/dist>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
  </Directory>

  ProxyPreserveHost On
  ProxyPass /api/ http://127.0.0.1:3002/api/
  ProxyPassReverse /api/ http://127.0.0.1:3002/api/
  RequestHeader set X-Forwarded-Proto "https"

  ErrorLog ${APACHE_LOG_DIR}/source.haan.lu-error.log
  CustomLog ${APACHE_LOG_DIR}/source.haan.lu-access.log combined

  SSLEngine on
  SSLCertificateFile /etc/letsencrypt/live/source.haan.lu/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/source.haan.lu/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
